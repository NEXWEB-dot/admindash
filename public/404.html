<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Not found · GroundsNearMe staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/tokens.css" />
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>

<!--
  Cloudflare Pages serves this file automatically for any unmatched path, with a
  real 404 status. That is why there is no _redirects file: a `/* /index.html`
  rewrite would answer 200 for every probe of a staff URL, and a 404 status is
  not valid in _redirects at all (only 200, 301, 302, 303, 307 and 308 are).
-->

<main class="auth-shell">
  <div class="card-outer auth-card">
    <div class="card-inner card-inner--roomy center">
      <p class="eyebrow eyebrow--tight">GroundsNearMe</p>
      <h1 class="section-heading h-sm page-title">Page not found</h1>
      <p class="meta meta--before">Either a stale bookmark or a URL that never existed.</p>
      <a class="btn-primary btn-link" href="/">Go to sign in</a>
    </div>
  </div>
</main>

</body>
</html>
